<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kashagi Loans | Staff dashboard</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="topbar"><a class="brand" href="/">KASHAGI <span>LOANS</span></a><a class="toplink" href="/">Public website</a></header>
<main class="admin-wrap"><section class="admin-card"><div class="eyebrow">PRIVATE AREA</div><h1>Applications dashboard</h1><p class="muted">Staff access only. Keep your password private.</p>
<div id="login-area"><form id="login-form" class="admin-form"><label for="password">Admin password</label><input id="password" type="password" required autocomplete="current-password"><button class="primary" type="submit">Sign in →</button><p id="login-message" class="muted" role="status"></p></form></div>
<div id="dashboard" hidden><button id="logout" class="secondary">Sign out</button><p id="dash-message" class="muted"></p><div class="table-wrap"><table><thead><tr><th>Ref / Date</th><th>Applicant</th><th>Contact</th><th>Amount</th><th>Purpose</th><th>Status</th></tr></thead><tbody id="applications"></tbody></table></div></div>
</section></main><script src="/admin.js" defer></script></body></html>
